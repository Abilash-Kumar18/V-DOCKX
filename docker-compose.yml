version: "3.8"

services:
  # Python 3.11 FastAPI Backend with WebSocket Telemetry
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: vdockx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      - ./config:/app/config:ro
      - ./results:/app/results
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Next.js 16 Web Dashboard & Mobile Camera Transmitter
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: vdockx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/telemetry
    depends_on:
      backend:
        condition: service_healthy

  # Unified Nginx Gateway / Reverse Proxy (Port 80 -> UI & Backend)
  gateway:
    image: nginx:alpine
    container_name: vdockx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

networks:
  default:
    name: vdockx-network
